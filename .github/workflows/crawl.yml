name: crawl

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Per-shard page limit (0 = unlimited); use a small number for smoke tests"
        default: "0"
      max_works:
        description: "Complete works per shard (0 = unlimited); minimal end-to-end runs"
        default: "0"
      max_seconds:
        description: "Per-shard crawl time budget in seconds (280min; leaves 60min for parse/build in the 340min job cap)"
        default: "16800"
  schedule:
    # Continuous during a pass, no-op while idle. Pass cadence and the
    # anti-auto-disable heartbeat live in config.yaml / coordinate.
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: crawl-coordinate
      cancel-in-progress: false
    outputs:
      phase: ${{ steps.phase.outputs.phase }}
      pass_completed: ${{ steps.phase.outputs.pass_completed }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --no-dev

      - name: Decide phase
        id: phase
        run: uv run python -m sources.syosetu.acquire --coordinate

      # The pass just finished: all zips are up, publish its manifest.
      # {pass}.M is a regular release, so releases/latest/download/ points
      # at the newest pass; zip chunk releases are prereleases.
      - name: Publish pass manifest
        if: steps.phase.outputs.pass_completed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYOSETSU_DADB_PUBLISH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SYOSETSU_DADB_PUBLISH_TOKEN not set; pass manifest NOT published"
            exit 0
          fi
          label=$(uv run python -c "from pathlib import Path; from core.summary import pass_label; print(pass_label(Path('sources/syosetu/state/pass.json')))")
          uv run python -m core.publish \
            --repo dariyooo/syosetsu-dadb --site syosetu \
            --works sources/syosetu/state/works.json \
            --pass-file sources/syosetu/state/pass.json \
            --manifest-from "stats/syosetu-$label.json"

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/syosetu/state
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "crawl(syosetu): pass state [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

  crawl:
    needs: coordinate
    if: needs.coordinate.outputs.phase == 'crawl'
    strategy:
      fail-fast: false
      matrix:
        site: [syosetu]
        shard: [0, 1, 2]
    # never two overlapping runs of one shard
    concurrency:
      group: crawl-${{ matrix.site }}-${{ matrix.shard }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Sync to latest state
        run: git pull --rebase --autostash origin main

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --no-dev

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # language_processing lives in the private dalang repo; GITHUB_TOKEN
      # cannot read other repos, so pub clones through a fine-grained PAT
      # (secret DALANG_READ_TOKEN, Contents: read on dariyooo/dalang).
      - name: Authorize private package repo
        env:
          DALANG_TOKEN: ${{ secrets.DALANG_READ_TOKEN }}
        run: |
          if [ -z "$DALANG_TOKEN" ]; then
            echo "::error::secret DALANG_READ_TOKEN is not set; cannot fetch language_processing"
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${DALANG_TOKEN}@github.com/dariyooo/dalang".insteadOf \
            "https://github.com/dariyooo/dalang"

      # Validate the whole toolchain BEFORE spending hours crawling: a
      # misconfigured builder must fail in a minute, not after the crawl.
      - name: Validate builder toolchain
        run: cd builder && dart pub get

      - name: Crawl shard
        run: |
          uv run python -m sources.${{ matrix.site }}.acquire \
            --shard ${{ matrix.shard }} \
            --out out \
            --max-seconds "${{ inputs.max_seconds || 16800 }}" \
            --max-pages "${{ inputs.max_pages || 0 }}" \
            --max-works "${{ inputs.max_works || 0 }}"

      # Text is an on-runner handoff only: raw dumps and parsed .txt are
      # never uploaded; they die with the runner.
      - name: Parse
        run: |
          shopt -s nullglob
          batches=(out/${{ matrix.site }}/*.jsonl.zst)
          if [ ${#batches[@]} -eq 0 ]; then
            echo "no batches produced"
            exit 0
          fi
          uv run python -m sources.${{ matrix.site }}.parse "${batches[@]}" \
            --out out/text/${{ matrix.site }}

      - name: Build bank zips
        run: |
          if [ ! -d out/text/${{ matrix.site }} ]; then
            echo "nothing to build"
            exit 0
          fi
          cd builder
          dart run bin/build_bank.dart ../out/text/${{ matrix.site }} \
            ../out/banks/${{ matrix.site }} --site=${{ matrix.site }}

      # Each shard only writes its own cursor-N.json, so a rebase against
      # the other shards' commits is always clean.
      - name: Commit shard state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/${{ matrix.site }}/state
          if git diff --cached --quiet; then
            echo "no state change"
            exit 0
          fi
          git commit -m "crawl(${{ matrix.site }}): shard ${{ matrix.shard }} state [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          exit 1

      # Interim destination until step-8 upload automation lands.
      - name: Upload bank zips
        uses: actions/upload-artifact@v4
        with:
          name: banks-${{ matrix.site }}-shard${{ matrix.shard }}-${{ github.run_id }}
          path: out/banks/${{ matrix.site }}/*.zip
          if-no-files-found: ignore
          retention-days: 30

      - name: Hand off build stats
        uses: actions/upload-artifact@v4
        with:
          name: buildstats-${{ matrix.site }}-shard${{ matrix.shard }}-${{ github.run_id }}
          path: out/banks/${{ matrix.site }}/build_summary.json
          if-no-files-found: ignore
          retention-days: 7

  # One committed stats update per workflow run, aggregated over all shards.
  summarize:
    needs: [coordinate, crawl]
    if: ${{ !cancelled() && needs.coordinate.outputs.phase == 'crawl' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Sync to latest state
        run: git pull --rebase --autostash origin main

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --no-dev

      - uses: actions/download-artifact@v4
        with:
          pattern: buildstats-*-${{ github.run_id }}
          path: buildstats

      - name: Merge stats
        run: |
          shopt -s nullglob
          files=(buildstats/*/build_summary.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no build stats this run"
            exit 0
          fi
          uv run python -m core.summary --stats stats --site syosetu \
            --pass-file sources/syosetu/state/pass.json "${files[@]}"

      - uses: actions/download-artifact@v4
        with:
          pattern: banks-*-${{ github.run_id }}
          path: banks

      - name: Publish bank zips to pass releases
        env:
          GH_TOKEN: ${{ secrets.SYOSETSU_DADB_PUBLISH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SYOSETSU_DADB_PUBLISH_TOKEN not set; zips NOT published"
            exit 0
          fi
          shopt -s nullglob
          zips=(banks/*/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "no zips this run"
            exit 0
          fi
          uv run python -m core.publish \
            --repo dariyooo/syosetsu-dadb --site syosetu \
            --works sources/syosetu/state/works.json \
            --pass-file sources/syosetu/state/pass.json \
            --zips "${zips[@]}"

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          if git diff --cached --quiet; then
            echo "no stats change"
            exit 0
          fi
          git commit -m "crawl(syosetu): update stats [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
