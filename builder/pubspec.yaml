name: builder
description: Text -> DaDb example bank builder
publish_to: none
environment:
  sdk: ^3.6.0

dependencies:
  archive: ^4.0.9
  crypto: ^3.0.7
  language_processing:
    git:
      url: https://github.com/dariyooo/dalang.git
      path: dart_packages/language_processing
      ref: refactor-v4

# Mirrors the workspace-wide override da_db declares in dalang: tongrams_dart
# still constrains code_assets ^1.2.0 while sqlite_extensions needs ^2.0.0.
dependency_overrides:
  hooks: ^2.2.0
  code_assets: ^2.0.0

# The builder never calls the sqlite-extension-backed APIs; skip their
# prebuilt binaries, which are only fetchable inside the dalang workspace.
hooks:
  user_defines:
    sqlite_extensions:
      allow_missing_binaries: true

dev_dependencies:
  test: ^1.25.0
